name: Security Report
description: Parses SARIF report, appends summary with badge to job summary, upserts sticky PR comment, and uploads artifact

inputs:
  title:
    description: Title displayed on top of the security report
    required: false
    default: Security Scan Report
  sarif-file:
    description: Path to the SARIF output file
    required: true
  comment-tag:
    description: Identifier tag used to match and update sticky PR comments
    required: false
    default: security-report
  badge-label:
    description: Label text for the shields.io badge
    required: false
    default: Security
  github-token:
    description: GitHub token with pull-requests write permission
    required: false
    default: ${{ github.token }}
  fail-on-findings:
    description: Whether to fail the workflow if security findings are detected
    required: false
    default: "false"
  upload-artifact:
    description: Whether to upload the SARIF report as a workflow artifact
    required: false
    default: "true"
  manage-issue:
    description: Whether to create, update, or close an automated GitHub Issue
    required: false
    default: "false"
  issue-title:
    description: Title of the automated GitHub Issue
    required: false
    default: "[Security Audit] Active Vulnerabilities Detected"

outputs:
  total-findings:
    description: "Total number of findings detected"
  report-file:
    description: "Path to the generated Markdown report file"

runs:
  using: node24
  main: dist/index.js
