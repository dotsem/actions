name: "Build Flutter App"
description: "Sets up Flutter, resolves metadata from pubspec.yaml, installs target OS dependencies, builds, and packages artifacts."

inputs:
  target:
    description: "Target platform to build: linux, macos, windows, android-apk, android-aab, or ios"
    required: true
  flutter-version:
    description: "Flutter SDK version. Empty reads environment.flutter from <working-directory>/pubspec.yaml"
    required: false
    default: ""
  channel:
    description: "Flutter channel"
    required: false
    default: "stable"
  cache:
    description: "Whether to cache Flutter SDK artifacts"
    required: false
    default: "true"
  working-directory:
    description: "Directory containing pubspec.yaml"
    required: false
    default: "."
  build-mode:
    description: "Build mode: debug, profile, or release"
    required: false
    default: "release"

outputs:
  artifact-name:
    description: "Base name of packaged artifact"
    value: ${{ steps.package-meta.outputs.artifact-name }}
  artifact-path:
    description: "Path or glob of packaged artifact(s)"
    value: ${{ steps.package-meta.outputs.artifact-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        flutter-version-file: ${{ inputs.flutter-version == '' && format('{0}/pubspec.yaml', inputs.working-directory) || '' }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache == 'true' }}

    - name: Resolve App Metadata
      id: meta
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        BUILD_MODE: ${{ inputs.build-mode }}
      run: bash "${{ github.action_path }}/scripts/resolve-metadata.sh"

    - name: Install Linux dependencies
      if: inputs.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libgtk-3-dev libblkid-dev liblzma-dev libglib2.0-dev

    - name: Install Dart dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get

    - name: Build Linux
      if: inputs.target == 'linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build linux "--$BUILD_MODE"

    - name: Build macOS
      if: inputs.target == 'macos'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build macos "--$BUILD_MODE"

    - name: Build Windows
      if: inputs.target == 'windows'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build windows "--$BUILD_MODE"

    - name: Set up Gradle Cache
      if: (inputs.target == 'android-apk' || inputs.target == 'android-aab') && inputs.cache == 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Build Android APK
      if: inputs.target == 'android-apk'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build apk "--$BUILD_MODE"

    - name: Build Android AAB
      if: inputs.target == 'android-aab'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build appbundle "--$BUILD_MODE"

    - name: Build iOS
      if: inputs.target == 'ios'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # TODO: support code signing
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: flutter build ios "--$BUILD_MODE" --no-codesign

    - name: Package Linux
      if: inputs.target == 'linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        APP_NAME: ${{ env.APP_NAME }}
        MODE_SUFFIX: ${{ env.MODE_SUFFIX }}
      run: bash "${{ github.action_path }}/scripts/package-linux.sh"

    - name: Package macOS
      if: inputs.target == 'macos'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        APP_NAME: ${{ env.APP_NAME }}
        MODE_SUFFIX: ${{ env.MODE_SUFFIX }}
      run: bash "${{ github.action_path }}/scripts/package-macos.sh"

    - name: Package Windows
      if: inputs.target == 'windows'
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        APP_NAME: ${{ env.APP_NAME }}
        MODE_SUFFIX: ${{ env.MODE_SUFFIX }}
      run: pwsh "${{ github.action_path }}/scripts/package-windows.ps1"

    - name: Package Android
      if: inputs.target == 'android-apk' || inputs.target == 'android-aab'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        BUILD_MODE: ${{ inputs.build-mode }}
        APP_NAME: ${{ env.APP_NAME }}
        MODE_SUFFIX: ${{ env.MODE_SUFFIX }}
      run: bash "${{ github.action_path }}/scripts/package-android.sh"

    - name: Package iOS
      if: inputs.target == 'ios'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_NAME: ${{ env.APP_NAME }}
        MODE_SUFFIX: ${{ env.MODE_SUFFIX }}
      run: bash "${{ github.action_path }}/scripts/package-ios.sh"

    - name: Set artifact outputs
      id: package-meta
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
          echo "::error::Packaging produced no artifacts in dist/"
          exit 1
        fi
        echo "artifact-name=${APP_NAME}-${TARGET}${MODE_SUFFIX}" >> "$GITHUB_OUTPUT"
        echo "artifact-path=${WORKING_DIRECTORY}/dist/*" >> "$GITHUB_OUTPUT"
