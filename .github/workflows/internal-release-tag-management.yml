name: Release & Tag Management

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-tag-management
  cancel-in-progress: false

jobs:
  update-floating-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Floating Tag
        run: |
          # We skip pre-releases
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Skipping floating tag update for pre-release: $GITHUB_REF_NAME"
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa "v${MAJOR}" -m "Update v${MAJOR} to ${GITHUB_REF_NAME}"
          git push origin "v${MAJOR}" --force

          # float minor tag during 0.x for callers wanting minor isolation
          if [ "$MAJOR" = "0" ]; then
            git tag -fa "v0.${MINOR}" -m "Update v0.${MINOR} to ${GITHUB_REF_NAME}"
            git push origin "v0.${MINOR}" --force
          fi
