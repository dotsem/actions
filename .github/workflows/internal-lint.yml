name: Lint Scripts

on:
  pull_request:
    paths:
      - "**.sh"
      - "**.bash"
      - "**.ps1"
      - ".github/workflows/internal-lint.yml"
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - "**.ps1"
      - ".github/workflows/internal-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        shell: bash
        run: |
          git ls-files '*.sh' '*.bash' ':!:tests/*' | xargs -r shellcheck

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }

          $scripts = git ls-files "*.ps1" ":!:tests/*"
          if ($scripts) {
            $issues = $scripts | Invoke-ScriptAnalyzer -Severity Error, Warning
            if ($issues) {
              $issues | Format-Table -AutoSize
              exit 1
            }
          }
