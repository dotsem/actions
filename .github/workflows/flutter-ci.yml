name: Flutter CI

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of build targets to compile (e.g. ''["linux"]'')'
        required: false
        type: string
        default: ""
      pr-targets:
        description: 'JSON array of targets to compile on pull_request (e.g. ''["linux"]'')'
        required: false
        type: string
        default: ""
      push-targets:
        description: 'JSON array of targets to compile on push / other events (e.g. ''["linux", "windows", "macos"]'')'
        required: false
        type: string
        default: ""
      flutter-version:
        description: "Flutter SDK version (empty reads environment.flutter from pubspec.yaml)"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory containing pubspec.yaml"
        required: false
        type: string
        default: "."
      build-mode:
        description: "Build mode: debug, profile, or release"
        required: false
        type: string
        default: ""
      pr-build-mode:
        description: "Build mode for pull requests"
        required: false
        type: string
        default: ""
      push-build-mode:
        description: "Build mode for push events"
        required: false
        type: string
        default: ""
      concurrency-tests:
        description: "Concurrency level for flutter test"
        required: false
        type: number
        default: 4

jobs:
  setup-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-mode: ${{ steps.set-matrix.outputs.build-mode }}
    steps:
      - id: set-matrix
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.unpinned-action.unpinned-action
        uses: dotsem/actions/flutter-matrix@main
        with:
          targets: ${{ inputs.targets }}
          pr-targets: ${{ inputs.pr-targets }}
          push-targets: ${{ inputs.push-targets }}
          build-mode: ${{ inputs.build-mode }}
          pr-build-mode: ${{ inputs.pr-build-mode }}
          push-build-mode: ${{ inputs.push-build-mode }}

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.unpinned-action.unpinned-action
        uses: dotsem/actions/setup-flutter@main
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: flutter analyze
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.unpinned-action.unpinned-action
        uses: dotsem/actions/setup-flutter@main
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: flutter test --concurrency=${{ inputs.concurrency-tests }}
        working-directory: ${{ inputs.working-directory }}

  build:
    name: Build (${{ matrix.target }} - ${{ needs.setup-matrix.outputs.build-mode }})
    needs: [setup-matrix, analyze, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build App
        id: build
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.unpinned-action.unpinned-action
        uses: dotsem/actions/build-flutter@main
        with:
          target: ${{ matrix.target }}
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
          build-mode: ${{ needs.setup-matrix.outputs.build-mode }}
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.artifact-path }}
          retention-days: 7
