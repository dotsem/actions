name: Check dist/

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: check-dist-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-node
        with:
          node-version: "24"

      - name: Rebuild action bundles
        run: pnpm build

      - name: Compare expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol **/dist/ | wc -l)" -gt "0" ]; then
            echo "::error::Detected uncommitted changes after pnpm build. Run 'pnpm build' locally and commit the result."
            git diff
            exit 1
          fi

      - name: Upload expected dist on failure
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: "**/dist/"
