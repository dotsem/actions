name: Test Flutter Action

on:
  pull_request:
    paths:
      - "build-flutter/**"
      - ".github/workflows/flutter-*.yml"
      - ".github/workflows/internal-test-flutter.yml"
      - "tests/fixtures/flutter/**"
  push:
    branches: [main]
    paths:
      - "build-flutter/**"
      - ".github/workflows/flutter-*.yml"
      - ".github/workflows/internal-test-flutter.yml"
      - "tests/fixtures/flutter/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-flutter-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-build-flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: "release"
            expected-suffix: ""
          - build-mode: "debug"
            expected-suffix: "-debug"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test build-flutter (${{ matrix.build-mode }})
        id: build-app
        uses: ./build-flutter
        with:
          target: "linux"
          build-mode: ${{ matrix.build-mode }}
          working-directory: "tests/fixtures/flutter"
      - name: Assert build artifacts and outputs
        shell: bash
        env:
          EXPECTED_NAME: "test_app-linux${{ matrix.expected-suffix }}"
        run: |
          test -f "tests/fixtures/flutter/dist/${EXPECTED_NAME}.tar.gz"
          tar -tzf "tests/fixtures/flutter/dist/${EXPECTED_NAME}.tar.gz" > /dev/null
          if [ "${{ steps.build-app.outputs.artifact-name }}" != "$EXPECTED_NAME" ]; then
            echo "Expected artifact-name '$EXPECTED_NAME', got '${{ steps.build-app.outputs.artifact-name }}'"
            exit 1
          fi
          if [ "${{ steps.build-app.outputs.artifact-path }}" != "tests/fixtures/flutter/dist/*" ]; then
            echo "Expected artifact-path 'tests/fixtures/flutter/dist/*', got '${{ steps.build-app.outputs.artifact-path }}'"
            exit 1
          fi
