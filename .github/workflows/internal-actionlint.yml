name: Lint Workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # github-check reporter
      pull-requests: write # github-pr-review reporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          filter_mode: ${{ github.event_name == 'pull_request' && 'file' || 'nofilter' }}
          fail_level: error
