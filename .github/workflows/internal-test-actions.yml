name: Test actions

on:
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "**.md"
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-actions-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-node-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test setup-node
        uses: ./setup-node
        with:
          node-version: "22"
          working-directory: tests/fixtures/node

      - name: Verify toolchain binaries
        shell: bash
        run: |
          node -v
          pnpm -v

      - name: Test build-node
        uses: ./build-node
        with:
          working-directory: tests/fixtures/node

  test-security-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First test if a clean report with no findings works as expected
      - name: Run security-report with clean fixture
        id: report-clean
        uses: ./security-report
        with:
          title: "Clean Security Report"
          sarif-file: "tests/fixtures/clean.sarif"
          comment-tag: "test-clean"
          fail-on-findings: "true"
      - name: Assert clean outputs
        shell: bash
        run: |
          if [ "${{ steps.report-clean.outputs.total-findings }}" -ne 0 ]; then
            echo "Expected 0 findings, got ${{ steps.report-clean.outputs.total-findings }}"
            exit 1
          fi
          grep -q "Passed ✅" "${{ steps.report-clean.outputs.report-file }}"

      # Then test if a report with vulns is working
      - name: Run security-report with dirty fixture
        id: report-dirty
        uses: ./security-report
        with:
          title: "Dirty Security Report"
          sarif-file: "tests/fixtures/dirty.sarif"
          comment-tag: "test-report"
          fail-on-findings: "false"

      - name: Assert dirty outputs
        shell: bash
        run: |
          if [ "${{ steps.report-dirty.outputs.total-findings }}" -ne 2 ]; then
            echo "Expected 2 findings, got ${{ steps.report-dirty.outputs.total-findings }}"
            exit 1
          fi
          test -f "${{ steps.report-dirty.outputs.report-file }}"

  lint-scripts:
    name: Lint Shell & PowerShell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        shell: bash
        run: |
          git ls-files '*.sh' '*.bash' ':!:tests/*' | xargs -r shellcheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }

          $scripts = git ls-files "*.ps1" ":!:tests/*"
          if ($scripts) {
             $issues = $scripts | Invoke-ScriptAnalyzer -Severity Error, Warning
             if ($issues) {
               $issues | Format-Table -AutoSize
               exit 1
             }
           }
