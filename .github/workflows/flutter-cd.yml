name: Flutter CD

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of targets to build and release (e.g. ''["linux", "windows", "macos"]'')'
        required: true
        type: string
      tag:
        description: "Release tag (optional, defaults to release event or ref)"
        required: false
        type: string
      flutter-version:
        description: "Flutter SDK version (empty reads environment.flutter from pubspec.yaml)"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory containing pubspec.yaml"
        required: false
        type: string
        default: "."
    secrets:
      token:
        description: "GitHub token with contents:write permission (defaults to github.token)"
        required: false

concurrency:
  group: flutter-cd-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  setup-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotsem/actions/flutter-matrix@main
        with:
          targets: ${{ inputs.targets }}

  build:
    name: Build & Upload (${{ matrix.target }})
    needs: [setup-matrix]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build App
        id: build
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotsem/actions/build-flutter@main
        with:
          target: ${{ matrix.target }}
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Upload binary to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.artifact-path }}
          file_glob: true
          tag: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          overwrite: true
